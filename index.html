<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ditschiteiser</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/svg+xml" href="icon.svg?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=2">
<meta name="theme-color" content="#818cf8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ditschiteiser">
<link rel="preload" href="./BigShouldersDisplay-Variable.woff2" as="font" type="font/woff2" crossorigin>

<script>
// Apply theme before first paint to avoid flash
(function () {
  try {
    var stored = localStorage.getItem('ditschiteiser-theme');
    var theme = (stored === 'light' || stored === 'dark')
      ? stored
      : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
<meta name="color-scheme" content="light dark">
<style>

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; font-weight: inherit; }
  small { font-size: inherit; }

  :root, [data-theme="light"] { color-scheme: light; }
  [data-theme="dark"] { color-scheme: dark; }

  body {
    --mode-color:     #818cf8;
    --mode-color-a05: rgba(129,140,248,.05);
    --mode-color-a12: rgba(129,140,248,.12);
    --mode-color-a50: rgba(129,140,248,.50);
  }
  body[data-mode="measure"],
  body[data-mode="measureCalibrate"] {
    --mode-color:     #34d399;
    --mode-color-a05: rgba(52,211,153,.05);
    --mode-color-a12: rgba(52,211,153,.12);
    --mode-color-a50: rgba(52,211,153,.50);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: var(--fs);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-synthesis: none;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  #main { display: flex; flex: 1; overflow: hidden; position: relative; }

  #canvasWrap {
    flex: 1; position: relative; overflow: hidden;
    background: var(--canvas); cursor: crosshair;
  }
  #canvasWrap.panning { cursor: grabbing; }
  #canvasWrap.pan-ready { cursor: grab; }

  #viewport  { position: absolute; inset: 0; transform-origin: 0 0; display: none; }
  #theImage  { display: block; max-width: none; user-select: none; pointer-events: none; }
  #overlay   { position: absolute; top: 0; left: 0; pointer-events: none; }

  #cursorInfo {
    position: absolute; bottom: 12px; left: 12px;
    background: var(--cursor-bg); color: var(--mode-color);
    font-size: var(--fs); padding: 4px 9px; border-radius: var(--radius-sm, 4px);
    pointer-events: none; display: none;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  #magnifier {
    position: absolute; width: 160px; height: 160px;
    border-radius: var(--mag-radius, 8px); border: 1.5px solid #000;
    box-shadow: 0 8px 28px var(--shadow);
    pointer-events: none; display: none; z-index: 10; background: var(--canvas);
  }

  #dropZone input { display: none; }

  #toastMsg {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: var(--success); color: var(--toast-fg);
    padding: 7px 18px; border-radius: 999px;
    font-weight: 700; font-size: var(--fs);
    transition: transform .3s ease; pointer-events: none; z-index: 1000;
  }
  #toastMsg.show { transform: translateX(-50%) translateY(0); }

  #modalOverlay {
    display: none; position: fixed; inset: 0;
    background: var(--modal-scrim); z-index: 500;
    align-items: center; justify-content: center;
  }
  #modalOverlay.open { display: flex; }
  .modal-fields { display: flex; flex-direction: column; gap: 8px; }
  .field-row { display: flex; align-items: center; gap: 8px; }
  .field-row input:focus { outline: none; border-color: var(--accent); }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }

  .btn { cursor: pointer; transition: background .15s, color .15s, border-color .15s, opacity .15s, transform .1s, box-shadow .15s; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .35; cursor: default; transform: none; }
  .btn:focus-visible, .sidebar-toggle:focus-visible, #dropZone label:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #themeToggle { flex-shrink: 0; }
  #themeToggle svg { width: 16px; height: 16px; display: block; }
  #themeToggle .icon-sun { display: none; }
  #themeToggle .icon-moon { display: block; }
  [data-theme="dark"] #themeToggle .icon-sun { display: block; }
  [data-theme="dark"] #themeToggle .icon-moon { display: none; }

  #clockDisplay { font-variant-numeric: tabular-nums; color: var(--muted); }

  .slot-del, .data-item button {
    background: none; border: none; color: var(--muted);
    cursor: pointer; line-height: 1; padding: 0 2px; flex-shrink: 0;
    transition: color .15s;
  }
  .slot-del:hover, .data-item button:hover { color: var(--danger); }

  .scale-row {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 8px; color: var(--muted);
  }
  .scale-row span { flex-shrink: 0; }
  .scale-row select { cursor: pointer; }

  #refLengthContent { color: var(--muted); padding: 2px 0 4px; line-height: 1.6; }
  .slot-content { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px; }
  .slot-hint { color: var(--muted); font-style: italic; }
  .slot-lbl  { color: var(--muted); white-space: nowrap; }
  .slot-coords { font-family: var(--font-mono); color: var(--text); font-variant-numeric: tabular-nums; }

  :root, [data-theme="light"] {
    --bg: #e8eaef;
    --surface: rgba(255,255,255,.72);
    --card: rgba(255,255,255,.55);
    --panel: rgba(255,255,255,.8);
    --accent: #818cf8;
    --success: #34d399;
    --danger: #f43f5e;
    --text: #16161d;
    --muted: #5c5c6b;
    --border: rgba(255,255,255,.62);
    --radius: 12px;
    --radius-sm: 8px;
    --canvas: #eceef3;
    --drop-border: rgba(22,22,29,.16);
    --cursor-bg: rgba(17,17,24,.78);
    --modal-scrim: rgba(20,20,28,.4);
    --shadow: rgba(30, 34, 50, .16);
    --input-border: rgba(22,22,29,.12);
    --slot-bg: rgba(255,255,255,.4);
    --data-bg: rgba(255,255,255,.4);
    --toast-fg: #041016;
    --ref-amber: #d97706;
    --marker-label: #ffffff;
    --marker-shadow: #000000;
    --font: "Big Shoulders Display", sans-serif;
    --font-mono: "Big Shoulders Display", sans-serif;
    --fs: 16px;
    --glass: rgba(255,255,255,.70);
    --glass-border: rgba(255,255,255,.7);
    --glass-shadow: 0 10px 40px rgba(30, 34, 50, .12), 0 1px 0 rgba(255,255,255,.7) inset;
  }
  [data-theme="dark"] {
    --bg: #0c0d12;
    --surface: rgba(22,24,34,.72);
    --card: rgba(255,255,255,.06);
    --panel: rgba(255,255,255,.08);
    --accent: #818cf8;
    --success: #34d399;
    --danger: #fb7185;
    --text: #f2f3f8;
    --muted: #9aa0b4;
    --border: rgba(255,255,255,.12);
    --canvas: #0a0b10;
    --drop-border: rgba(255,255,255,.16);
    --cursor-bg: rgba(0,0,0,.78);
    --modal-scrim: rgba(0,0,0,.62);
    --shadow: rgba(0,0,0,.5);
    --input-border: rgba(255,255,255,.14);
    --slot-bg: rgba(255,255,255,.04);
    --data-bg: rgba(255,255,255,.05);
    --toast-fg: #041016;
    --ref-amber: #fbbf24;
    --glass: rgba(18, 20, 30, .72);
    --glass-border: rgba(255,255,255,.12);
    --glass-shadow: 0 12px 40px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.08) inset;
  }

  body { background: var(--canvas); }

  /* Floating tool clusters */
  #topbar {
    position: absolute;
    top: 14px; left: 14px; right: 14px;
    height: auto;
    padding: 0;
    background: transparent;
    border: none;
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    gap: 10px;
    z-index: 30;
    pointer-events: none;
    flex-shrink: 0;
  }
  .tool-cluster {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px;
    border-radius: 999px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    backdrop-filter: blur(18px) saturate(1.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
  }
  .tool-brand { padding-left: 8px; padding-right: 12px; gap: 8px; }
  .brand-icon { width: 22px; height: 22px; border-radius: 7px; display: block; }
  #topbar h1 { font-size: var(--fs); font-weight: 900; letter-spacing: 0.05em; line-height: 1; text-transform: uppercase; }
  .sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }

  .btn {
    padding: 6px 12px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--text);
    font-size: var(--fs);
    font-weight: 700;
  }
  .btn:hover { background: rgba(127,127,140,.12); }
  .btn-secondary { background: transparent; }
  .btn-digitize { background: #818cf8; color: #fff; }
  .btn-digitize.off { background: transparent; color: var(--muted); }
  .btn-digitize.off:hover { color: #818cf8; background: rgba(129,140,248,.14); }
  .btn-measure { background: #34d399; color: #041016; }
  .btn-measure.off { background: transparent; color: var(--muted); }
  .btn-measure.off:hover { color: #34d399; background: rgba(52,211,153,.14); }

  #themeToggle {
    width: 32px; height: 32px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--muted);
    border: none; border-radius: 999px; cursor: pointer;
  }
  #themeToggle:hover { color: var(--text); background: rgba(127,127,140,.12); }
  #clockDisplay { padding: 0 10px 0 4px; font-size: var(--fs); font-weight: 600; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

  #dropZone {
    position: absolute; inset: 86px 28px 28px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    color: var(--muted);
    border: 1.5px dashed var(--drop-border); border-radius: 24px;
    background: var(--glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    transition: border-color .2s, color .2s;
  }
  #dropZone.drag-over { border-color: var(--accent); color: var(--accent); }
  #dropZone svg { width: 44px; height: 44px; opacity: .3; }
  #dropZone p { font-weight: 800; color: var(--text); font-size: var(--fs); }
  #dropZone small { opacity: .7; }
  #dropZone label {
    margin-top: 4px;
    padding: 8px 18px;
    background: var(--text); color: var(--bg);
    border-radius: 999px;
    cursor: pointer; font-weight: 700;
  }
  #dropZone label:hover { background: var(--accent); color: #fff; }
  [data-theme="dark"] #dropZone label { color: #0a0b10; }

  #sidebar {
    position: absolute;
    top: 74px; right: 14px; bottom: 14px;
    --sidebar-width: 304px;
    width: var(--sidebar-width);
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    box-shadow: var(--glass-shadow);
    backdrop-filter: blur(22px) saturate(1.4);
    -webkit-backdrop-filter: blur(22px) saturate(1.4);
    display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
    z-index: 25;
    transition: transform .28s ease, opacity .22s ease, width .28s ease;
  }
  #sidebarToggle {
    flex-shrink: 0;
    align-self: flex-end;
    margin: 6px 8px 0;
    width: 28px; height: 28px;
    border: none; border-radius: 999px;
    background: rgba(127,127,140,.12);
    color: var(--muted);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  #sidebarToggle:hover { color: var(--text); background: rgba(127,127,140,.2); }
  #sidebarToggle svg { width: 16px; height: 16px; display: block; }
  body.sidebar-collapsed #sidebar {
    --sidebar-width: 50px;
    width: var(--sidebar-width);
  }
  body.sidebar-collapsed #sidebar > :not(#sidebarToggle) {
    display: none !important;
  }
  body.sidebar-collapsed #sidebarToggle { margin: 10px auto 0; }
  body.sidebar-collapsed #sidebarToggle svg { transform: rotate(180deg); }

  #guideCard {
    margin: 0 14px 2px; padding: 8px 12px;
    background: var(--card); border-radius: 14px;
    border-left: none;
    color: var(--muted); line-height: 1.5;
    flex-shrink: 0; display: none;
  }
  #guideCard strong { color: var(--text); display: block; margin-bottom: 2px; font-weight: 800; }
  #guideCard div { font-size: var(--fs); }
  #refSlots > .btn {
    width: auto !important; margin: 6px 2px 0 auto !important;
    display: block; background: transparent; border: none;
    color: var(--muted); font-weight: 700; padding: 4px 2px !important;
  }
  #refSlots > .btn:hover { color: var(--text); background: transparent; }

  .panel { padding: 8px 14px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .panel-header h2, #exportPanel h2, .data-header {
    font-size: var(--fs); text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); font-weight: 800;
  }
  .badge {
    font-weight: 700; font-size: var(--fs); padding: 2px 8px;
    border-radius: 999px; background: rgba(127,127,140,.12); color: var(--muted);
  }
  .badge.needed, .badge.ready, .badge.neutral {
    color: var(--mode-color); background: var(--mode-color-a12);
  }

  .scale-row select {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 3px 6px;
  }

  .ref-slot {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 8px; border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--slot-bg);
    margin-bottom: 5px;
  }
  .ref-slot.active { border-color: var(--mode-color-a50); background: var(--mode-color-a05); }
  .slot-num {
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(127,127,140,.16); color: var(--muted);
    font-size: var(--fs); font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .ref-slot.active .slot-num, .ref-slot.filled .slot-num {
    background: var(--mode-color); color: #fff;
  }

  .data-header {
    padding: 12px 14px 4px;
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  #dataList {
    flex: 1; overflow-y: auto; padding: 4px 14px 8px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .data-item {
    display: flex; align-items: center; gap: 7px;
    background: var(--data-bg); border-radius: 10px; padding: 4px 9px;
    font-family: var(--font-mono); font-size: var(--fs);
    font-variant-numeric: tabular-nums;
  }
  .data-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mode-color); flex-shrink: 0; }
  .data-item .lbl { color: var(--muted); min-width: 18px; }
  .data-item .coords { flex: 1; }

  #exportPanel {
    padding: 8px 14px 12px; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
  }
  .export-row { display: flex; gap: 6px; }
  .export-row .btn { flex: 1; padding: 7px 8px; background: rgba(127,127,140,.12); }
  .export-row .btn:hover { background: rgba(127,127,140,.2); }

  #cursorInfo { bottom: 18px; left: 18px; border-radius: 999px; padding: 4px 12px; }

  #modal {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 20px; padding: 22px;
    min-width: 320px; display: flex; flex-direction: column; gap: 14px;
    box-shadow: var(--glass-shadow);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
  }
  #modal h3 { font-size: var(--fs); font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text); }
  #modal p  { color: var(--muted); line-height: 1.55; }
  .field-row label { width: 84px; color: var(--muted); }
  .field-row input {
    flex: 1; background: var(--card);
    border: 1px solid var(--input-border); border-radius: 10px;
    color: var(--text); padding: 7px 10px;
    font-family: var(--font-mono); font-size: var(--fs); font-variant-numeric: tabular-nums;
  }

  #magnifier { border-radius: 16px; --mag-radius: 16px; }


  /* Self-hosted variable Big Shoulders Display — used for all UI text. */
  @font-face {
    font-family: "Big Shoulders Display";
    src: url("./BigShouldersDisplay-Variable.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }

  /* Uniform 16px everywhere. Weight and tracking carry the hierarchy. */
  #topbar h1 {
    font-family: var(--font);
    font-size: var(--fs);
    font-weight: 900;
    font-style: normal;
    letter-spacing: 0.05em;
    line-height: 1;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .panel-header h2,
  #exportPanel h2,
  #listTitle {
    font-family: var(--font);
    font-size: var(--fs);
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .btn, #dropZone label, .badge, .slot-num, #toastMsg {
    font-weight: 700;
  }
  .tool-cluster, .btn, #clockDisplay {
    white-space: nowrap;
  }
  .slot-hint { font-style: normal; font-weight: 500; }
  .data-item .lbl { min-width: 22px; }
  .field-row label { width: 96px; font-weight: 600; }
  .sep { height: 18px; }

</style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <div class="tool-cluster tool-brand">
    <img class="brand-icon" src="icon.svg?v=2" width="22" height="22" alt="">
    <h1>Ditschiteiser</h1>
  </div>
  <div class="tool-cluster tool-actions">
  <button class="btn btn-secondary" id="loadNewBtn">Load image</button>
  <button class="btn btn-secondary" id="clearPtsBtn">Clear</button>
  <button class="btn btn-secondary" id="fitBtn" title="Fit image to window (0 / F)">Fit</button>
  <div class="sep" id="modeSep"></div>
  <button class="btn btn-digitize off" id="digitizeModeBtn">Digitize</button>
  <button class="btn btn-measure off" id="measureModeBtn">Measure</button>
  </div>
  <div class="tool-cluster tool-meta">
  <button class="btn" id="themeToggle" type="button" title="Toggle light/dark theme" aria-label="Toggle theme">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/>
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
  </button>
  <div id="clockDisplay"></div>
  </div>
</div>

<!-- Main -->
<div id="main">

  <!-- Canvas area -->
  <div id="canvasWrap">
    <div id="dropZone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M3 15l4-4 4 4 4-6 4 6"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
      </svg>
      <p>Drop an image here</p>
      <small>PNG, JPG, GIF, BMP, WebP, SVG — or Ctrl/Cmd+V to paste</small>
      <label>Browse file<input type="file" id="fileInput" accept="image/*"></label>
    </div>

    <div id="viewport">
      <img id="theImage" alt="">
      <canvas id="overlay"></canvas>
    </div>

    <div id="cursorInfo"></div>
    <canvas id="magnifier" width="160" height="160"></canvas>
  </div>

  <!-- Sidebar -->
  <div id="sidebar">
    <button type="button" id="sidebarToggle" class="sidebar-toggle" title="Hide panel" aria-label="Hide panel" aria-expanded="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 6l6 6-6 6"/>
      </svg>
    </button>

    <div id="guideCard"></div>

    <!-- Reference points (digitize mode) -->
    <div class="panel" id="refPanel" style="display:none">
      <div class="panel-header">
        <h2>Reference Points</h2>
        <span class="badge needed" id="refBadge">0 / 3</span>
      </div>
      <div class="scale-row">
        <span>X axis</span>
        <select id="xScaleSelect">
          <option value="linear">Linear</option>
          <option value="log">Log₁₀</option>
        </select>
        <span>Y axis</span>
        <select id="yScaleSelect">
          <option value="linear">Linear</option>
          <option value="log">Log₁₀</option>
        </select>
      </div>
      <div id="refSlots"></div>
    </div>

    <!-- Reference length (measure mode) -->
    <div class="panel" id="refLengthPanel" style="display:none">
      <div class="panel-header">
        <h2>Reference Length</h2>
        <span class="badge needed" id="refLengthBadge">Not set</span>
      </div>
      <div id="refLengthContent"></div>
    </div>

    <!-- Data points / Measurements -->
    <div class="data-header">
      <span id="listTitle">Data Points</span>
      <span class="badge neutral" id="ptCount" style="display:none">0</span>
    </div>
    <div id="dataList"></div>

    <!-- Export -->
    <div id="exportPanel">
      <h2>Export</h2>
      <div class="export-row">
        <button class="btn btn-secondary" id="csvBtn" disabled>⬇ CSV</button>
        <button class="btn btn-secondary" id="copyBtn" disabled>⎘ Copy</button>
      </div>
    </div>

  </div>
</div>

<!-- Modal -->
<div id="modalOverlay">
  <div id="modal">
    <h3 id="modalTitle"></h3>
    <p id="modalDesc"></p>
    <!-- Ref point fields -->
    <div class="modal-fields" id="modalRefFields">
      <div class="field-row">
        <label>Label</label>
        <input type="text" id="mLabel" placeholder="e.g. Origin">
      </div>
      <div class="field-row">
        <label>X (world)</label>
        <input type="number" id="mX" placeholder="0" step="any">
      </div>
      <div class="field-row">
        <label>Y (world)</label>
        <input type="number" id="mY" placeholder="0" step="any">
      </div>
    </div>
    <!-- Reference length field -->
    <div class="modal-fields" id="modalLengthFields" style="display:none">
      <div class="field-row">
        <label>Distance</label>
        <input type="number" id="mDistance" placeholder="e.g. 50" step="any">
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-secondary" id="modalCancel">Cancel</button>
      <button class="btn" style="background:var(--accent);color:#fff" id="modalOk">Confirm</button>
    </div>
  </div>
</div>

<div id="toastMsg"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
const state = {
  mode: 'load',         // 'load' | 'calibrate' | 'digitize' | 'measureCalibrate' | 'measure'
  imgW: 0, imgH: 0,
  xScale: 'linear',    // 'linear' | 'log'
  yScale: 'linear',    // 'linear' | 'log'
  refPoints:  [],      // max 3 — { px, py, wx, wy, label }
  dataPoints: [],      // { px, py, wx, wy }
  transform:  null,    // { a, b, c, d, e, f, warning } — affine: wx=a·px+b·py+c, wy=d·px+e·py+f
  pendingRef: null,    // { px, py } — pixel location awaiting modal (ref point or seg end)
  refSegAnchor: null,  // { px, py } — first click of measure calibration segment
  refSegment:  null,   // { px1,py1,px2,py2, pixelDist, worldDist, scale }
  measureAnchor: null, // { px, py } — first click of active measurement
  measurements: [],    // { px1,py1,px2,py2, dist }
  mousePos: null,      // { px, py } — live cursor
  zoom: 1, panX: 0, panY: 0,
};

// ── DOM refs ──────────────────────────────────────────────────────────────────
const dropZone        = document.getElementById('dropZone');
const fileInput       = document.getElementById('fileInput');
const viewport        = document.getElementById('viewport');
const theImage        = document.getElementById('theImage');
const overlay         = document.getElementById('overlay');
const ctx             = overlay.getContext('2d');
const canvasWrap      = document.getElementById('canvasWrap');
const cursorInfo      = document.getElementById('cursorInfo');
const refSlots        = document.getElementById('refSlots');
const refBadge        = document.getElementById('refBadge');
const refPanel        = document.getElementById('refPanel');
const refLengthPanel  = document.getElementById('refLengthPanel');
const refLengthBadge  = document.getElementById('refLengthBadge');
const refLengthContent = document.getElementById('refLengthContent');
const dataList        = document.getElementById('dataList');
const ptCount         = document.getElementById('ptCount');
const clearPtsBtn     = document.getElementById('clearPtsBtn');
const fitBtn          = document.getElementById('fitBtn');
const loadNewBtn      = document.getElementById('loadNewBtn');
const modeSep         = document.getElementById('modeSep');
const digitizeModeBtn = document.getElementById('digitizeModeBtn');
const measureModeBtn  = document.getElementById('measureModeBtn');
const xScaleSelect    = document.getElementById('xScaleSelect');
const yScaleSelect    = document.getElementById('yScaleSelect');
const csvBtn          = document.getElementById('csvBtn');
const copyBtn         = document.getElementById('copyBtn');
const modalOverlay    = document.getElementById('modalOverlay');
const modalTitle      = document.getElementById('modalTitle');
const modalDesc       = document.getElementById('modalDesc');
const mLabel          = document.getElementById('mLabel');
const mX              = document.getElementById('mX');
const mY              = document.getElementById('mY');
const mDistance       = document.getElementById('mDistance');
const modalRefFields  = document.getElementById('modalRefFields');
const modalLengthFields = document.getElementById('modalLengthFields');
const modalCancel     = document.getElementById('modalCancel');
const modalOk         = document.getElementById('modalOk');
const toastMsg        = document.getElementById('toastMsg');
const clockDisplay    = document.getElementById('clockDisplay');
const themeToggle     = document.getElementById('themeToggle');
const listTitle       = document.getElementById('listTitle');
const guideCard       = document.getElementById('guideCard');
const magnifier       = document.getElementById('magnifier');
const magCtx          = magnifier.getContext('2d');
const MAG_SIZE        = 160;
const MAG_HALF        = 24;
const MIN_ZOOM        = 0.05;
const MAX_ZOOM        = 40;

// ── Session / gesture helpers ─────────────────────────────────────────────────
function hasCalibOrPoints() {
  return state.refPoints.length > 0 || state.dataPoints.length > 0 ||
         state.measurements.length > 0 || !!state.refSegment;
}
function hasImageLoaded() {
  return viewport.style.display !== 'none';
}
function confirmDiscard(msg) {
  if (!hasCalibOrPoints()) return true;
  return confirm(msg);
}
function clearIncompleteGesture() {
  state.measureAnchor = null;
  state.refSegAnchor  = null;
  state.pendingRef    = null;
}

// ── Image loading ─────────────────────────────────────────────────────────────
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

loadNewBtn.addEventListener('click', () => {
  if (!confirmDiscard('Discard current calibration and points and load a new image?')) return;
  Object.assign(state, {
    refPoints: [], dataPoints: [], transform: null,
    measurements: [], measureAnchor: null,
    refSegment: null, refSegAnchor: null, pendingRef: null,
    xScale: 'linear', yScale: 'linear',
  });
  xScaleSelect.value = 'linear'; yScaleSelect.value = 'linear';
  viewport.style.display = 'none';
  cursorInfo.style.display = 'none';
  magnifier.style.display = 'none';
  dropZone.style.display = '';
  fileInput.value = '';
  setMode('load');
  renderRefSlots();
  renderDataList();
});

function loadFile(file) {
  // Decode into a staging image first — a corrupt file must not clobber
  // the currently displayed image or its calibration state
  const url = URL.createObjectURL(file);
  const probe = new Image();
  probe.onload = () => {
    theImage.onload = () => URL.revokeObjectURL(url);
    theImage.src = url;
    state.imgW = probe.naturalWidth;
    state.imgH = probe.naturalHeight;
    overlay.width  = state.imgW;
    overlay.height = state.imgH;
    dropZone.style.display = 'none';
    viewport.style.display = 'block';
    fitToWindow();
    Object.assign(state, {
      refPoints: [], dataPoints: [], transform: null,
      measurements: [], measureAnchor: null,
      refSegment: null, refSegAnchor: null, pendingRef: null,
      xScale: 'linear', yScale: 'linear',
    });
    xScaleSelect.value = 'linear'; yScaleSelect.value = 'linear';
    renderRefSlots(); renderDataList(); renderAll();
    setMode('calibrate');
  };
  probe.onerror = () => {
    URL.revokeObjectURL(url);
    fileInput.value = '';
    toast('Could not load this file — unsupported or corrupt image', true);
  };
  probe.src = url;
}

// ── Coordinate transform (digitize mode) ─────────────────────────────────────
function wxOf(p) { return state.xScale === 'log' ? Math.log10(p.wx) : p.wx; }
function wyOf(p) { return state.yScale === 'log' ? Math.log10(p.wy) : p.wy; }

function computeTransform() {
  const pts = state.refPoints;
  if (pts.length < 2) { state.transform = null; return; }

  // Validate log-scale values before computing
  if (state.xScale === 'log' && pts.some(p => p.wx <= 0)) {
    state.transform = { a:0,b:0,c:0,d:0,e:0,f:0,
      warning: 'Log₁₀ X axis requires all reference X values to be positive (> 0).' };
    return;
  }
  if (state.yScale === 'log' && pts.some(p => p.wy <= 0)) {
    state.transform = { a:0,b:0,c:0,d:0,e:0,f:0,
      warning: 'Log₁₀ Y axis requires all reference Y values to be positive (> 0).' };
    return;
  }

  const allSameWX = pts.every(p => Math.abs(wxOf(p) - wxOf(pts[0])) < 1e-9);
  const allSameWY = pts.every(p => Math.abs(wyOf(p) - wyOf(pts[0])) < 1e-9);
  const allSamePX = pts.every(p => Math.abs(p.px - pts[0].px) < 1e-6);
  const allSamePY = pts.every(p => Math.abs(p.py - pts[0].py) < 1e-6);
  let warning = null;
  if      (allSameWX && allSameWY) warning = 'All reference points have the same world X and Y — calibration is impossible.';
  else if (allSameWX) warning = 'All reference points share the same world X — X scale cannot be determined.';
  else if (allSameWY) warning = 'All reference points share the same world Y — Y scale cannot be determined.';
  else if (allSamePX) warning = 'All reference points are on the same vertical pixel column — X scale cannot be determined.';
  else if (allSamePY) warning = 'All reference points are on the same horizontal pixel row — Y scale cannot be determined.';

  if (pts.length >= 3) {
    // Full affine transform: wx = a·px + b·py + c,  wy = d·px + e·py + f
    // Solved exactly from the first 3 reference points via Cramer's rule.
    // Guarantees that all 3 calibration points reproduce their entered world coords exactly.
    const [p1, p2, p3] = pts;
    const wx1 = wxOf(p1), wx2 = wxOf(p2), wx3 = wxOf(p3);
    const wy1 = wyOf(p1), wy2 = wyOf(p2), wy3 = wyOf(p3);

    const det = p1.px*(p2.py - p3.py) - p1.py*(p2.px - p3.px) + (p2.px*p3.py - p3.px*p2.py);
    // Reject exact collinearity and near-flat triangles. Height relative to the
    // longest side (and to image size) catches unstable affines where a 1 px
    // click error maps to a huge world error.
    const absDet = Math.abs(det);
    const side = (a, b) => Math.hypot(a.px - b.px, a.py - b.py);
    const maxSide = Math.max(side(p1, p2), side(p2, p3), side(p3, p1));
    const height = maxSide > 0 ? absDet / maxSide : 0; // area = maxSide*height/2
    const minDim = Math.max(1, Math.min(state.imgW, state.imgH));
    const tooFlat = absDet < 1e-9 || height < 4 || height / minDim < 0.005;
    if (tooFlat) {
      warning = warning || (absDet < 1e-9
        ? 'The 3 reference points are collinear in pixel space — calibration is impossible.'
        : 'The 3 reference points are nearly collinear — calibration is unstable. Spread them out (e.g. both ends of the X axis and one far on Y).');
      state.transform = { a:0,b:0,c:0,d:0,e:0,f:0, warning };
      return;
    }
    const a = (wx1*(p2.py-p3.py) - p1.py*(wx2-wx3) + (wx2*p3.py - wx3*p2.py)) / det;
    const b = (p1.px*(wx2-wx3)   - wx1*(p2.px-p3.px) + (p2.px*wx3 - p3.px*wx2)) / det;
    const c = (p1.px*(p2.py*wx3-p3.py*wx2) - p1.py*(p2.px*wx3-p3.px*wx2) + wx1*(p2.px*p3.py-p3.px*p2.py)) / det;
    const d = (wy1*(p2.py-p3.py) - p1.py*(wy2-wy3) + (wy2*p3.py - wy3*p2.py)) / det;
    const e = (p1.px*(wy2-wy3)   - wy1*(p2.px-p3.px) + (p2.px*wy3 - p3.px*wy2)) / det;
    const f = (p1.px*(p2.py*wy3-p3.py*wy2) - p1.py*(p2.px*wy3-p3.px*wy2) + wy1*(p2.px*p3.py-p3.px*p2.py)) / det;
    state.transform = { a, b, c, d, e, f, warning };
  } else {
    // 2 points: axis-independent OLS (wx depends only on px, wy only on py)
    const n = pts.length;
    let spx=0, spy=0, swx=0, swy=0, spx2=0, spy2=0, spxwx=0, spywy=0;
    for (const p of pts) {
      const wx = wxOf(p), wy = wyOf(p);
      spx += p.px; spy += p.py; swx += wx; swy += wy;
      spx2 += p.px*p.px; spy2 += p.py*p.py;
      spxwx += p.px*wx; spywy += p.py*wy;
    }
    const denX = n*spx2 - spx*spx;
    const denY = n*spy2 - spy*spy;
    const sx = Math.abs(denX) > 1e-9 ? (n*spxwx - spx*swx) / denX : 0;
    const sy = Math.abs(denY) > 1e-9 ? (n*spywy - spy*swy) / denY : 0;
    const ox = (swx - sx*spx) / n;
    const oy = (swy - sy*spy) / n;
    state.transform = { a:sx, b:0, c:ox, d:0, e:sy, f:oy, warning };
  }
}

function pixelToWorld(px, py) {
  // A transform carrying a warning yields no valid mapping — treat as absent
  if (!state.transform || state.transform.warning) return null;
  const { a, b, c, d, e, f } = state.transform;
  const lx = a*px + b*py + c;
  const ly = d*px + e*py + f;
  return {
    x: state.xScale === 'log' ? Math.pow(10, lx) : lx,
    y: state.yScale === 'log' ? Math.pow(10, ly) : ly,
  };
}

// When the transform changes, recompute stored world coords for existing data points
function recomputeDataPoints() {
  if (!state.transform || state.transform.warning) return;
  state.dataPoints = state.dataPoints.map(p => {
    const w = pixelToWorld(p.px, p.py);
    return w ? { ...p, wx: w.x, wy: w.y } : p;
  });
}

// Format a value for display/export — exponential notation for very small or
// very large magnitudes, where toFixed(5) would lose all significant digits
function fmtNum(v) {
  const a = Math.abs(v);
  if (v !== 0 && (a < 1e-4 || a >= 1e7)) return v.toExponential(5);
  return v.toFixed(5);
}

// ── Fit / zoom / pan ──────────────────────────────────────────────────────────
function applyViewport() {
  viewport.style.transform = `translate(${state.panX}px,${state.panY}px) scale(${state.zoom})`;
}

// True while the view matches a Fit (initial load, Fit button, 0/F, or auto-refit).
// Cleared when the user zooms or pans, so a sidebar toggle will not clobber their view.
let viewIsFitted = true;

// Rectangle, in canvasWrap-local pixels, not covered by the floating toolbars or side panel.
function visibleFitRect() {
  const wrap = canvasWrap.getBoundingClientRect();
  const pad = 24;
  let x = pad, y = pad, right = wrap.width - pad, bottom = wrap.height - pad;

  const topbar = document.getElementById('topbar');
  if (topbar) {
    const r = topbar.getBoundingClientRect();
    y = Math.max(y, r.bottom - wrap.top + pad);
  }

  const sidebar = document.getElementById('sidebar');
  if (sidebar) {
    const r = sidebar.getBoundingClientRect();
    const targetW = parseFloat(getComputedStyle(sidebar).getPropertyValue('--sidebar-width'));
    const width = Number.isFinite(targetW) && targetW > 0 ? targetW : r.width;
    const rightInset = Math.max(0, wrap.right - r.right);
    right = Math.min(right, wrap.width - width - rightInset - pad);
  }

  return { x, y, w: Math.max(1, right - x), h: Math.max(1, bottom - y) };
}

function fitToWindow() {
  if (!state.imgW || !state.imgH) return;
  const rect = visibleFitRect();
  // Fit fully in the unobstructed area; allow enlarge for small images (no hard cap at 1).
  state.zoom = Math.min(rect.w / state.imgW, rect.h / state.imgH);
  state.zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, state.zoom));
  state.panX = rect.x + (rect.w - state.imgW * state.zoom) / 2;
  state.panY = rect.y + (rect.h - state.imgH * state.zoom) / 2;
  applyViewport();
  viewIsFitted = true;
}
function zoomAtClient(clientX, clientY, factor) {
  const r = canvasWrap.getBoundingClientRect();
  const mx = clientX - r.left, my = clientY - r.top;
  const imgX = (mx - state.panX) / state.zoom;
  const imgY = (my - state.panY) / state.zoom;
  const newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, state.zoom * factor));
  state.panX = mx - imgX * newZoom;
  state.panY = my - imgY * newZoom;
  state.zoom = newZoom;
  viewIsFitted = false;
  applyViewport();
  renderAll();
}
window.addEventListener('resize', () => {
  if (viewport.style.display === 'none') return;
  fitToWindow();
  renderAll(); // Bug 1: marker sizes depend on zoom
});

// Wheel zoom around cursor
canvasWrap.addEventListener('wheel', e => {
  if (viewport.style.display === 'none') return;
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  zoomAtClient(e.clientX, e.clientY, factor);
  // Refresh HUD / loupe under cursor
  const { px, py } = clientToImg(e.clientX, e.clientY);
  if (px >= 0 && py >= 0 && px <= state.imgW && py <= state.imgH) {
    state.mousePos = { px, py };
    if (state.mode !== 'load') {
      drawMagnifier(px, py); positionMagnifier(e.clientX, e.clientY);
      magnifier.style.display = 'block';
    }
  }
}, { passive: false });

// Pan: middle-drag, right-drag, or Space+left-drag
let isPanning = false;
let panMoved  = false;
let suppressNextClick = false; // set when a pan gesture starts with the left button
let panStart  = null; // { x, y, panX, panY }
let spaceDown = false;

function isTypingTarget(el) {
  const t = el && el.tagName;
  return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' || (el && el.isContentEditable);
}

canvasWrap.addEventListener('mousedown', e => {
  if (viewport.style.display === 'none') return;
  if (modalOverlay.classList.contains('open')) return;
  const panBtn = e.button === 1 || e.button === 2 || (e.button === 0 && spaceDown);
  if (!panBtn) return;
  e.preventDefault();
  isPanning = true;
  panMoved  = false;
  if (e.button === 0) suppressNextClick = true;
  panStart  = { x: e.clientX, y: e.clientY, panX: state.panX, panY: state.panY };
  canvasWrap.classList.add('panning');
  canvasWrap.classList.remove('pan-ready');
});
window.addEventListener('mousemove', e => {
  if (!isPanning || !panStart) return;
  const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
    panMoved = true;
    viewIsFitted = false;
  }
  state.panX = panStart.panX + dx;
  state.panY = panStart.panY + dy;
  applyViewport();
});
window.addEventListener('mouseup', () => {
  if (!isPanning) return;
  isPanning = false;
  panStart  = null;
  canvasWrap.classList.remove('panning');
  if (spaceDown) canvasWrap.classList.add('pan-ready');
});
canvasWrap.addEventListener('contextmenu', e => {
  // Right-drag is used for pan — suppress the browser menu over the image.
  if (viewport.style.display !== 'none') e.preventDefault();
});
canvasWrap.addEventListener('auxclick', e => {
  // Prevent middle-click auto-scroll / open-link quirks
  if (e.button === 1) e.preventDefault();
});

fitBtn.addEventListener('click', () => {
  if (viewport.style.display === 'none') return;
  fitToWindow(); renderAll();
});

// ── Mouse tracking ────────────────────────────────────────────────────────────
window.addEventListener('mousemove', e => {
  if (viewport.style.display === 'none') return;
  const { px, py } = clientToImg(e.clientX, e.clientY);
  const over = px >= 0 && py >= 0 && px <= state.imgW && py <= state.imgH;
  if (over) {
    cursorInfo.style.display = 'block';
    // World coords only after a full 3-point calibration (mode flips to digitize).
    const w = state.mode === 'digitize' ? pixelToWorld(px, py) : null;
    if (w) {
      cursorInfo.textContent = `px(${Math.round(px)}, ${Math.round(py)})  →  (${fmtNum(w.x)}, ${fmtNum(w.y)})`;
    } else {
      const anchor = state.measureAnchor || state.refSegAnchor;
      if (anchor) {
        const pixDist = Math.sqrt((px - anchor.px)**2 + (py - anchor.py)**2);
        const info = state.refSegment
          ? `d = ${(pixDist / state.refSegment.scale).toFixed(4)}`
          : `${Math.round(pixDist)} px`;
        cursorInfo.textContent = `px(${Math.round(px)}, ${Math.round(py)})  ${info}`;
      } else {
        cursorInfo.textContent = `px(${Math.round(px)}, ${Math.round(py)})`;
      }
    }
    state.mousePos = { px, py };
    if (state.mode !== 'load') {
      drawMagnifier(px, py); positionMagnifier(e.clientX, e.clientY);
      magnifier.style.display = 'block';
    }
    if ((state.mode === 'measure' && state.measureAnchor) ||
        (state.mode === 'measureCalibrate' && state.refSegAnchor)) renderAll();
  } else {
    cursorInfo.style.display = 'none';
    magnifier.style.display = 'none';
  }
});
canvasWrap.addEventListener('mouseleave', () => {
  magnifier.style.display = 'none'; cursorInfo.style.display = 'none';
  state.mousePos = null;
  if ((state.mode === 'measure' && state.measureAnchor) ||
      (state.mode === 'measureCalibrate' && state.refSegAnchor)) renderAll();
});

function clientToImg(cx, cy) {
  const r = canvasWrap.getBoundingClientRect();
  return { px: (cx - r.left - state.panX) / state.zoom, py: (cy - r.top - state.panY) / state.zoom };
}

// ── Magnifier ─────────────────────────────────────────────────────────────────
function drawMagnifier(imgPx, imgPy) {
  const srcX = imgPx - MAG_HALF, srcY = imgPy - MAG_HALF, srcW = MAG_HALF * 2;
  const scale = MAG_SIZE / srcW;
  magCtx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--canvas').trim() || '#eef1f5';
  magCtx.fillRect(0, 0, MAG_SIZE, MAG_SIZE);
  magCtx.imageSmoothingEnabled = false;
  magCtx.drawImage(theImage, srcX, srcY, srcW, srcW, 0, 0, MAG_SIZE, MAG_SIZE);

  state.refPoints.forEach(p => {
    const mx = (p.px - srcX) * scale, my = (p.py - srcY) * scale;
    if (mx < -12 || mx > MAG_SIZE + 12 || my < -12 || my > MAG_SIZE + 12) return;
    magCtx.beginPath(); magCtx.arc(mx, my, 5, 0, Math.PI*2);
    magCtx.strokeStyle = '#818cf8'; magCtx.lineWidth = 1.5; magCtx.stroke();
  });
  state.dataPoints.forEach(p => {
    const mx = (p.px - srcX) * scale, my = (p.py - srcY) * scale;
    if (mx < -8 || mx > MAG_SIZE + 8 || my < -8 || my > MAG_SIZE + 8) return;
    magCtx.beginPath(); magCtx.arc(mx, my, 3, 0, Math.PI*2);
    magCtx.fillStyle = '#818cf8'; magCtx.fill();
  });
  state.measurements.forEach(m => {
    [[m.px1, m.py1], [m.px2, m.py2]].forEach(([mpx, mpy]) => {
      const mx = (mpx - srcX) * scale, my = (mpy - srcY) * scale;
      if (mx < -8 || mx > MAG_SIZE + 8 || my < -8 || my > MAG_SIZE + 8) return;
      magCtx.beginPath(); magCtx.arc(mx, my, 3, 0, Math.PI*2);
      magCtx.fillStyle = '#34d399'; magCtx.fill();
    });
  });
  if (state.measureAnchor) {
    const mx = (state.measureAnchor.px - srcX) * scale, my = (state.measureAnchor.py - srcY) * scale;
    if (mx >= -8 && mx <= MAG_SIZE + 8 && my >= -8 && my <= MAG_SIZE + 8) {
      magCtx.beginPath(); magCtx.arc(mx, my, 3, 0, Math.PI*2);
      magCtx.fillStyle = '#34d399'; magCtx.fill();
    }
  }

  const cx = MAG_SIZE / 2, cy = MAG_SIZE / 2;
  magCtx.strokeStyle = 'rgba(0,0,0,.4)'; magCtx.lineWidth = 1;
  magCtx.setLineDash([3, 3]);
  magCtx.beginPath(); magCtx.moveTo(cx, 0); magCtx.lineTo(cx, MAG_SIZE);
  magCtx.moveTo(0, cy); magCtx.lineTo(MAG_SIZE, cy); magCtx.stroke();
  magCtx.setLineDash([]);

  if (state.mode === 'digitize') {
    magCtx.beginPath(); magCtx.arc(cx, cy, 6, 0, Math.PI*2);
    magCtx.strokeStyle = '#818cf8'; magCtx.lineWidth = 2; magCtx.stroke();
  } else if (state.mode === 'measure' || state.mode === 'measureCalibrate') {
    magCtx.beginPath(); magCtx.arc(cx, cy, 6, 0, Math.PI*2);
    magCtx.strokeStyle = '#34d399'; magCtx.lineWidth = 2; magCtx.stroke();
  } else {
    magCtx.beginPath(); magCtx.arc(cx, cy, 6, 0, Math.PI*2);
    magCtx.strokeStyle = '#818cf8'; magCtx.lineWidth = 2; magCtx.stroke();
  }
}
function positionMagnifier(cx, cy) {
  const r = canvasWrap.getBoundingClientRect(), off = 18;
  let l = cx - r.left + off, t = cy - r.top - MAG_SIZE - off;
  if (l + MAG_SIZE > r.width)  l = cx - r.left - MAG_SIZE - off;
  if (t < 0)                   t = cy - r.top + off;
  magnifier.style.left = l + 'px'; magnifier.style.top = t + 'px';
}

// ── Click handler ─────────────────────────────────────────────────────────────
canvasWrap.addEventListener('click', e => {
  if (e.button !== 0) return;
  if (viewport.style.display === 'none') return;
  if (modalOverlay.classList.contains('open')) return;
  // Ignore the click that ends a Space+left pan
  if (suppressNextClick || panMoved || spaceDown) {
    suppressNextClick = false; panMoved = false; return;
  }
  const { px, py } = clientToImg(e.clientX, e.clientY);
  if (px < 0 || py < 0 || px > state.imgW || py > state.imgH) return;

  if (state.mode === 'calibrate' && state.refPoints.length < 3) {
    state.pendingRef = { px, py };
    openRefModal(state.refPoints.length + 1, px, py);
    return;
  }

  if (state.mode === 'digitize') {
    const w = pixelToWorld(px, py);
    if (!w) return;
    state.dataPoints.push({ px, py, wx: w.x, wy: w.y });
    renderDataList(); renderAll(); updateExportButtons(); updateGuideCard();
    return;
  }

  if (state.mode === 'measureCalibrate') {
    if (!state.refSegAnchor) {
      state.refSegAnchor = { px, py };
      updateGuideCard(); updateRefLengthPanel(); renderAll();
    } else {
      // Reject near-zero segments: scale = pixelDist/worldDist would be ~0
      // and every measurement would come out as Infinity
      const segLen = Math.sqrt((px - state.refSegAnchor.px)**2 + (py - state.refSegAnchor.py)**2);
      if (segLen < 2) {
        toast('Points are too close — pick a longer reference segment', true);
        return;
      }
      state.pendingRef = { px, py };
      openLengthModal();
    }
    return;
  }

  if (state.mode === 'measure') {
    if (!state.measureAnchor) {
      state.measureAnchor = { px, py };
      updateGuideCard(); renderAll();
    } else {
      const a = state.measureAnchor;
      const pixelDist = Math.sqrt((px - a.px)**2 + (py - a.py)**2);
      const dist = pixelDist / state.refSegment.scale;
      state.measurements.push({ px1: a.px, py1: a.py, px2: px, py2: py, dist });
      state.measureAnchor = null;
      renderDataList(); renderAll(); updateGuideCard(); updateExportButtons(); updateModePill();
    }
  }
});

// ── Modal ─────────────────────────────────────────────────────────────────────
let currentModalType = 'ref';

function openRefModal(n, px, py) {
  currentModalType = 'ref';
  modalTitle.textContent = `Reference Point ${n} of 3`;
  modalDesc.textContent  = `Pixel: (${Math.round(px)}, ${Math.round(py)}) — enter the real-world coordinates.`;
  modalRefFields.style.display    = '';
  modalLengthFields.style.display = 'none';
  mLabel.value = `Ref ${n}`;
  mX.value = ''; mY.value = '';
  mX.style.borderColor = ''; mY.style.borderColor = '';
  mX.placeholder = state.xScale === 'log' ? '> 0' : '0';
  mY.placeholder = state.yScale === 'log' ? '> 0' : '0';
  modalOverlay.classList.add('open');
  setTimeout(() => mX.focus(), 50);
}

function openLengthModal() {
  currentModalType = 'length';
  modalTitle.textContent = 'Reference Length';
  modalDesc.textContent  = 'Enter the real-world distance between the two clicked points.';
  modalRefFields.style.display    = 'none';
  modalLengthFields.style.display = '';
  mDistance.value = '';
  mDistance.style.borderColor = '';
  modalOverlay.classList.add('open');
  setTimeout(() => mDistance.focus(), 50);
}

function closeModal() { modalOverlay.classList.remove('open'); }

function cancelModal() {
  closeModal();
  state.pendingRef = null;
  if (currentModalType === 'length') {
    state.refSegAnchor = null;
    renderAll(); updateGuideCard(); updateRefLengthPanel();
  }
}
modalCancel.addEventListener('click', cancelModal);
modalOk.addEventListener('click', () => {
  if (currentModalType === 'ref') confirmRef(); else confirmLength();
});
[mX, mY, mLabel].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') confirmRef(); }));
mDistance.addEventListener('keydown', e => { if (e.key === 'Enter') confirmLength(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalOverlay.classList.contains('open')) {
    e.preventDefault();
    cancelModal();
    return;
  }
  if (isTypingTarget(e.target)) return;

  if (e.code === 'Space' && !e.repeat) {
    e.preventDefault();
    spaceDown = true;
    if (!isPanning && viewport.style.display !== 'none') {
      canvasWrap.classList.add('pan-ready');
    }
    return;
  }
  // Fit to window
  if ((e.key === '0' || e.key === 'f' || e.key === 'F') && hasImageLoaded()) {
    e.preventDefault();
    fitToWindow(); renderAll();
  }
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space') {
    spaceDown = false;
    canvasWrap.classList.remove('pan-ready');
    if (!isPanning) canvasWrap.classList.remove('panning');
  }
});

// ── Paste image (Ctrl/Cmd+V) ──────────────────────────────────────────────────
document.addEventListener('paste', e => {
  if (isTypingTarget(e.target)) return;
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const item of items) {
    if (!item.type || !item.type.startsWith('image/')) continue;
    e.preventDefault();
    const file = item.getAsFile();
    if (!file) return;
    if (hasImageLoaded() || hasCalibOrPoints()) {
      if (!confirm('Replace current image and discard calibration/points?')) return;
    }
    loadFile(file);
    return;
  }
});

function confirmRef() {
  const wx = parseFloat(mX.value), wy = parseFloat(mY.value);
  let valid = true;
  if (isNaN(wx) || (state.xScale === 'log' && wx <= 0)) {
    mX.style.borderColor = 'var(--danger)'; valid = false;
  } else { mX.style.borderColor = ''; }
  if (isNaN(wy) || (state.yScale === 'log' && wy <= 0)) {
    mY.style.borderColor = 'var(--danger)'; valid = false;
  } else { mY.style.borderColor = ''; }
  if (!valid) return;

  const label = mLabel.value.trim() || `Ref ${state.refPoints.length + 1}`;
  state.refPoints.push({ ...state.pendingRef, wx, wy, label });
  state.pendingRef = null;
  computeTransform();
  recomputeDataPoints();
  closeModal();
  renderRefSlots();
  renderDataList();
  renderAll();

  syncModeWithTransform();
  updateSteps();
}

function confirmLength() {
  const dist = parseFloat(mDistance.value);
  if (isNaN(dist) || dist <= 0) {
    mDistance.style.borderColor = 'var(--danger)';
    return;
  }
  const { px: px1, py: py1 } = state.refSegAnchor;
  const { px: px2, py: py2 } = state.pendingRef;
  const pixelDist = Math.sqrt((px2 - px1)**2 + (py2 - py1)**2);
  state.refSegment = { px1, py1, px2, py2, pixelDist, worldDist: dist, scale: pixelDist / dist };
  state.refSegAnchor = null;
  state.pendingRef   = null;
  closeModal();
  renderAll();
  setMode('measure');
}

// ── Axis scale selectors ──────────────────────────────────────────────────────
// A scale change can validate or invalidate the calibration while the mode is
// still the old one — keep mode and calibration validity in sync
function syncModeWithTransform() {
  const valid = state.refPoints.length >= 3 && state.transform && !state.transform.warning;
  if      (state.mode === 'calibrate' && valid)  setMode('digitize');
  else if (state.mode === 'digitize'  && !valid) setMode('calibrate');
}
function onScaleChange() {
  state.xScale = xScaleSelect.value;
  state.yScale = yScaleSelect.value;
  computeTransform(); recomputeDataPoints(); syncModeWithTransform();
  renderDataList(); renderAll(); updateSteps();
}
xScaleSelect.addEventListener('change', onScaleChange);
yScaleSelect.addEventListener('change', onScaleChange);

// ── Mode buttons ──────────────────────────────────────────────────────────────
digitizeModeBtn.addEventListener('click', () => {
  if (viewport.style.display === 'none') return;
  clearIncompleteGesture();
  const calibrated = state.refPoints.length >= 3 && state.transform && !state.transform.warning;
  setMode(calibrated ? 'digitize' : 'calibrate');
  renderDataList(); renderAll();
});

measureModeBtn.addEventListener('click', () => {
  if (viewport.style.display === 'none') return;
  clearIncompleteGesture();
  if (state.refSegment) {
    setMode('measure');
  } else {
    setMode('measureCalibrate');
  }
  renderDataList(); renderAll();
});

clearPtsBtn.addEventListener('click', () => {
  const inMeasure = state.mode === 'measure' || state.mode === 'measureCalibrate';
  if (inMeasure) {
    if (!state.measurements.length && !state.measureAnchor) return;
    if (state.measurements.length && !confirm('Clear all measurements?')) return;
    state.measurements = []; state.measureAnchor = null;
  } else {
    if (!state.dataPoints.length) return;
    if (!confirm('Clear all data points?')) return;
    state.dataPoints = [];
  }
  renderDataList(); renderAll(); updateExportButtons(); updateModePill(); updateGuideCard();
});

// ── Mode management ───────────────────────────────────────────────────────────
function inMeasureMode() { return state.mode === 'measure' || state.mode === 'measureCalibrate'; }

function setMode(mode) {
  if (mode !== state.mode) clearIncompleteGesture();
  state.mode = mode;
  document.body.dataset.mode = mode;
  updateUI();
}

function updateUI() {
  updateModePill();
  updateExportButtons();
  updateGuideCard();
  updateRefBadge();
  updateRefLengthPanel();
  renderRefSlots();
}

function updateModePill() {
  const inDigitize = state.mode === 'calibrate' || state.mode === 'digitize';
  const inMeasure  = state.mode === 'measure'   || state.mode === 'measureCalibrate';
  listTitle.textContent = inMeasure ? 'Measurements' : 'Data Points';
  digitizeModeBtn.className = inDigitize ? 'btn btn-digitize' : 'btn btn-digitize off';
  measureModeBtn.className  = inMeasure  ? 'btn btn-measure'  : 'btn btn-measure off';
  // Update "Load image" label after first image is loaded
  loadNewBtn.textContent = viewport.style.display !== 'none' ? 'Load new image' : 'Load image';
}

function updateExportButtons() {
  // Digitize export requires a valid calibration so stale coords can't be exported
  const enabled = inMeasureMode()
    ? state.measurements.length > 0
    : state.mode === 'digitize' && state.dataPoints.length > 0;
  csvBtn.disabled  = !enabled;
  copyBtn.disabled = !enabled;
}

function updateRefBadge() {
  const n = state.refPoints.length;
  refBadge.className   = n < 3 ? 'badge needed' : 'badge ready';
  refBadge.textContent = n < 3 ? `${n} / 3` : '3 / 3 ✓';
  refPanel.style.display       = (state.mode === 'calibrate' || state.mode === 'digitize') ? '' : 'none';
  refLengthPanel.style.display = (state.mode === 'measure' || state.mode === 'measureCalibrate') ? '' : 'none';
}

function updateRefLengthPanel() {
  if (state.mode !== 'measure' && state.mode !== 'measureCalibrate') return;
  refLengthContent.innerHTML = '';
  if (!state.refSegment) {
    refLengthBadge.className   = 'badge needed';
    refLengthBadge.textContent = 'Not set';
    refLengthContent.textContent = state.refSegAnchor
      ? 'Click the second point to complete the reference segment.'
      : 'Click two points on a feature of known length.';
  } else {
    refLengthBadge.className   = 'badge ready';
    refLengthBadge.textContent = '✓ Set';
    const info = document.createElement('div');
    info.style.cssText = 'color:var(--ref-amber);font-weight:600;margin-bottom:5px';
    info.textContent = `1 unit = ${state.refSegment.scale.toFixed(4)} px`;
    const btn = document.createElement('button');
    btn.className = 'btn btn-secondary';
    btn.style.cssText = 'width:100%;margin-top:6px;font-size:var(--fs);padding:3px 8px';
    btn.textContent = 'Recalibrate';
    btn.addEventListener('click', () => {
      if ((state.measurements.length || state.refSegment) &&
          !confirm('Recalibrate length and clear all measurements?')) return;
      state.refSegment = null; state.measureAnchor = null; state.refSegAnchor = null;
      state.measurements = [];
      setMode('measureCalibrate'); renderDataList(); renderAll();
    });
    refLengthContent.append(info, btn);
  }
}

function updateSteps() {
  updateGuideCard();
  updateRefBadge();
  updateRefLengthPanel();
}

function updateGuideCard() {
  const hasImage = viewport.style.display !== 'none';
  if (!hasImage) { guideCard.style.display = 'none'; return; }
  guideCard.style.display = 'block';

  if (state.mode === 'measureCalibrate') {
    guideCard.className = '';
    guideCard.innerHTML = !state.refSegAnchor
      ? `<strong>Define reference length</strong>Click two points of a feature with known length.`
      : `<strong>Click the second point</strong>Then enter the real-world length of this segment.`;
    return;
  }
  if (state.mode === 'measure') {
    guideCard.className = '';
    guideCard.innerHTML = `<strong>Measure mode</strong>Select two points to measure the distance between them.`
      + `<div style="margin-top:6px;opacity:.85">Scroll = zoom · Middle/right-drag or Space+drag = pan · 0/F = fit</div>`;
    return;
  }

  const n = state.refPoints.length;
  if (n >= 3 && state.transform && state.transform.warning) {
    guideCard.className = '';
    guideCard.innerHTML = `<strong>Calibration problem</strong>${state.transform.warning}`;
    return;
  }
  if (n < 3) {
    guideCard.className = '';
    const logHint = (state.xScale === 'log' || state.yScale === 'log')
      ? ' Log axes require positive (non-zero) reference values.' : '';
    guideCard.innerHTML = `<strong>Place reference point ${n+1} of 3</strong>Click a known location on the image. A dialog will ask for its real-world coordinates.${logHint}`
      + `<div style="margin-top:6px;opacity:.85">Scroll = zoom · Middle/right-drag or Space+drag = pan · 0/F = fit · Ctrl/Cmd+V = paste</div>`;
    return;
  }
  guideCard.className = '';
  guideCard.innerHTML = `<strong>Digitize mode</strong>Click to record points.`
    + `<div style="margin-top:6px;opacity:.85">Scroll = zoom · Middle/right-drag or Space+drag = pan · 0/F = fit · Ctrl/Cmd+V = paste</div>`;
}

// ── Render canvas ─────────────────────────────────────────────────────────────
const COLOR_DIGITIZE = '#818cf8';
const COLOR_MEASURE  = '#34d399';
function colorRefSeg() {
  return getComputedStyle(document.documentElement).getPropertyValue('--ref-amber').trim() || '#f59e0b';
}

function renderAll() {
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  const inDigitize = state.mode === 'calibrate' || state.mode === 'digitize';
  const inMeasure  = state.mode === 'measure'   || state.mode === 'measureCalibrate';

  if (inDigitize) {
    state.refPoints.forEach((p, i) => drawMarker(p.px, p.py, COLOR_DIGITIZE, 6, p.label || `R${i+1}`, true));
    state.dataPoints.forEach((p, i) => drawMarker(p.px, p.py, COLOR_DIGITIZE, 3.5, `${i+1}`, false));
  }

  if (inMeasure) {
    // Reference segment in amber — clearly distinct from green measurements
    if (state.refSegment) {
      const s = state.refSegment;
      drawMeasureLine(s.px1, s.py1, s.px2, s.py2, `${s.worldDist}`, false, colorRefSeg());
    }

    // Completed measurements in green
    state.measurements.forEach(m => {
      drawMeasureLine(m.px1, m.py1, m.px2, m.py2, m.dist.toFixed(4), false, COLOR_MEASURE);
    });

    // measureCalibrate: anchor dot + line to fixed second point (or live cursor)
    if (state.mode === 'measureCalibrate' && state.refSegAnchor) {
      const z = state.zoom;
      ctx.save();
      ctx.beginPath(); ctx.arc(state.refSegAnchor.px, state.refSegAnchor.py, 5/z, 0, Math.PI*2);
      ctx.fillStyle = colorRefSeg(); ctx.globalAlpha = 1; ctx.fill();
      ctx.restore();
      const endpoint = state.pendingRef || state.mousePos;
      if (endpoint) {
        const d = Math.sqrt((endpoint.px - state.refSegAnchor.px)**2 + (endpoint.py - state.refSegAnchor.py)**2);
        drawMeasureLine(state.refSegAnchor.px, state.refSegAnchor.py,
                        endpoint.px, endpoint.py,
                        Math.round(d) + ' px', !state.pendingRef, colorRefSeg());
        if (state.pendingRef) {
          ctx.save();
          ctx.beginPath(); ctx.arc(state.pendingRef.px, state.pendingRef.py, 5/z, 0, Math.PI*2);
          ctx.fillStyle = colorRefSeg(); ctx.globalAlpha = 1; ctx.fill();
          ctx.restore();
        }
      }
    }

    // measure: anchor dot + live dashed line (green — actual measurement)
    if (state.mode === 'measure' && state.measureAnchor) {
      const z = state.zoom;
      ctx.save();
      ctx.beginPath(); ctx.arc(state.measureAnchor.px, state.measureAnchor.py, 5/z, 0, Math.PI*2);
      ctx.fillStyle = COLOR_MEASURE; ctx.globalAlpha = 1; ctx.fill();
      ctx.restore();
      if (state.mousePos) {
        const pixDist = Math.sqrt((state.mousePos.px - state.measureAnchor.px)**2 + (state.mousePos.py - state.measureAnchor.py)**2);
        const liveLabel = state.refSegment
          ? (pixDist / state.refSegment.scale).toFixed(4)
          : Math.round(pixDist) + ' px';
        drawMeasureLine(state.measureAnchor.px, state.measureAnchor.py,
                        state.mousePos.px, state.mousePos.py,
                        liveLabel, true, COLOR_MEASURE);
      }
    }
  }
}

function drawMeasureLine(px1, py1, px2, py2, label, dashed, color) {
  const z = state.zoom, c = color || '#34d399';
  ctx.save();
  ctx.strokeStyle = c; ctx.lineWidth = 1.5 / z; ctx.globalAlpha = 0.9;
  if (dashed) ctx.setLineDash([6/z, 4/z]);
  ctx.beginPath(); ctx.moveTo(px1, py1); ctx.lineTo(px2, py2); ctx.stroke();
  ctx.setLineDash([]);
  [[px1, py1], [px2, py2]].forEach(([x, y]) => {
    ctx.beginPath(); ctx.arc(x, y, 4/z, 0, Math.PI*2);
    ctx.fillStyle = c; ctx.globalAlpha = 1; ctx.fill();
  });
  if (label) {
    const mx = (px1 + px2) / 2, my = (py1 + py2) / 2;
    const fontSize = Math.round(15 / z);
    ctx.font = `bold ${fontSize}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 4/z;
    ctx.fillStyle = c; ctx.globalAlpha = 1;
    ctx.fillText(label, mx, my - 4/z);
  }
  ctx.restore();
}

function drawMarker(px, py, color, r, label, isRef) {
  const z = state.zoom, rr = r / z;
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = 1.5/z; ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.moveTo(px - rr*1.8, py); ctx.lineTo(px + rr*1.8, py);
  ctx.moveTo(px, py - rr*1.8); ctx.lineTo(px, py + rr*1.8);
  ctx.stroke();
  ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(px, py, rr, 0, Math.PI*2);
  if (isRef) {
    ctx.fillStyle = color + '25'; ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 2/z; ctx.stroke();
  } else { ctx.fillStyle = color; ctx.fill(); }
  const fontSize = Math.round(15 / z);
  ctx.font = `bold ${fontSize}px sans-serif`; ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
  ctx.shadowColor = '#000'; ctx.shadowBlur = 4/z;
  ctx.fillText(label, px + rr + 3/z, py - rr*2 - 4/z);
  ctx.restore();
}

// ── Reference slots ───────────────────────────────────────────────────────────
function renderRefSlots() {
  if (state.mode !== 'calibrate' && state.mode !== 'digitize') return;
  refSlots.innerHTML = '';
  const n = state.refPoints.length;
  for (let i = 0; i < 3; i++) {
    const el = document.createElement('div');
    const filled = i < n;
    const isNext = !filled && i === n && state.mode === 'calibrate';
    el.className = 'ref-slot' + (filled ? ' filled' : isNext ? ' active' : '');

    const numEl = document.createElement('div');
    numEl.className = 'slot-num';
    numEl.textContent = String(i + 1);

    const contentEl = document.createElement('div');
    contentEl.className = 'slot-content';

    if (filled) {
      const p = state.refPoints[i];
      const xDisp = state.xScale === 'log' ? p.wx.toExponential(2) : p.wx;
      const yDisp = state.yScale === 'log' ? p.wy.toExponential(2) : p.wy;

      const lblEl = document.createElement('span');
      lblEl.className = 'slot-lbl';
      lblEl.textContent = p.label;

      const coordsEl = document.createElement('span');
      coordsEl.className = 'slot-coords';
      coordsEl.textContent = `(${xDisp}, ${yDisp})`;

      contentEl.append(lblEl, coordsEl);

      const delBtn = document.createElement('button');
      delBtn.className = 'slot-del'; delBtn.title = 'Remove'; delBtn.textContent = '×';
      delBtn.addEventListener('click', () => {
        state.refPoints.splice(i, 1);
        computeTransform();
        recomputeDataPoints();
        setMode('calibrate');
        renderDataList(); renderAll();
      });
      el.append(numEl, contentEl, delBtn);
    } else {
      const hintEl = document.createElement('span');
      hintEl.className = 'slot-hint';
      hintEl.textContent = isNext ? 'Click on the image to place' : 'Waiting…';
      contentEl.append(hintEl);
      el.append(numEl, contentEl);
    }
    refSlots.appendChild(el);
  }

  // Recalibrate button — shown once all 3 slots are filled in digitize mode
  if (state.mode === 'digitize' && n >= 3) {
    const recalBtn = document.createElement('button');
    recalBtn.className = 'btn btn-secondary';
    recalBtn.style.cssText = 'width:100%;margin-top:6px;font-size:var(--fs);padding:3px 8px';
    recalBtn.textContent = 'Recalibrate';
    recalBtn.addEventListener('click', () => {
      if (!confirmDiscard('Recalibrate and clear all reference and data points?')) return;
      state.refPoints = []; state.dataPoints = [];
      computeTransform();
      setMode('calibrate');
      renderDataList(); renderAll(); updateExportButtons();
    });
    refSlots.appendChild(recalBtn);
  }

  updateRefBadge();
  updateModePill();
}

// ── Data list ─────────────────────────────────────────────────────────────────
function renderDataList() {
  const inMeasure = state.mode === 'measure' || state.mode === 'measureCalibrate';
  if (inMeasure) { renderMeasureList(); return; }

  const n = state.dataPoints.length;
  ptCount.textContent = n; ptCount.style.display = n > 0 ? '' : 'none';
  dataList.innerHTML = '';
  state.dataPoints.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'data-item';
    el.innerHTML = `
      <div class="data-dot"></div>
      <span class="lbl">${i+1}</span>
      <span class="coords">(${fmtNum(p.wx)}, ${fmtNum(p.wy)})</span>
      <button title="Remove">✕</button>`;
    el.querySelector('button').addEventListener('click', () => {
      state.dataPoints.splice(i, 1);
      renderDataList(); renderAll(); updateExportButtons(); updateModePill();
    });
    dataList.appendChild(el);
  });
}

function renderMeasureList() {
  const n = state.measurements.length;
  ptCount.textContent = n; ptCount.style.display = n > 0 ? '' : 'none';
  dataList.innerHTML = '';
  state.measurements.forEach((m, i) => {
    const el = document.createElement('div');
    el.className = 'data-item';
    el.innerHTML = `
      <div class="data-dot" style="background:#34d399"></div>
      <span class="lbl">${i+1}</span>
      <span class="coords">${fmtNum(m.dist)}</span>
      <button title="Remove">✕</button>`;
    el.querySelector('button').addEventListener('click', () => {
      state.measurements.splice(i, 1);
      renderMeasureList(); renderAll(); updateExportButtons(); updateModePill();
    });
    dataList.appendChild(el);
  });
}

// ── Export ────────────────────────────────────────────────────────────────────
function buildCSV() {
  if (inMeasureMode()) {
    return ['Measurement,Distance',
      ...state.measurements.map((m, i) => `${i+1},${fmtNum(m.dist)}`)
    ].join('\n');
  }
  return ['Point,X,Y',
    ...state.dataPoints.map((p, i) => `${i+1},${fmtNum(p.wx)},${fmtNum(p.wy)}`)
  ].join('\n');
}
function buildCopyText() {
  return buildCSV();
}
csvBtn.addEventListener('click', () => {
  const blob = new Blob([buildCSV()], { type: 'text/csv' });
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob),
    download: inMeasureMode() ? 'measurements.csv' : 'digitized_points.csv',
  });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('CSV downloaded');
});
copyBtn.addEventListener('click', () => {
  const text = buildCopyText();
  navigator.clipboard.writeText(text)
    .then(() => toast('Copied to clipboard!'))
    .catch(() => {
      const ta = Object.assign(document.createElement('textarea'), { value: text });
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); toast('Copied to clipboard!');
    });
});

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, isError) {
  toastMsg.style.background = isError ? 'var(--danger)' : '';
  toastMsg.style.color      = isError ? '#fff' : '';
  toastMsg.textContent = msg; toastMsg.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastMsg.classList.remove('show'), 2500);
}

// ── Clock ─────────────────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  clockDisplay.textContent =
    `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}  ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}
updateClock();
setInterval(updateClock, 1000);

// ── Theme ─────────────────────────────────────────────────────────────────────
function getTheme() {
  return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
}
function applyTheme(theme) {
  const t = theme === 'dark' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('ditschiteiser-theme', t); } catch (_) {}
  // Keep overlay marker contrast: redraw after theme change
  if (viewport.style.display !== 'none') renderAll();
  themeToggle.title = t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
}
themeToggle.addEventListener('click', () => {
  applyTheme(getTheme() === 'dark' ? 'light' : 'dark');
});
// Follow OS only when user has not chosen yet
try {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  mq.addEventListener('change', e => {
    if (localStorage.getItem('ditschiteiser-theme')) return;
    applyTheme(e.matches ? 'dark' : 'light');
  });
} catch (_) {}
applyTheme(getTheme()); // sync button title

// ── Init ──────────────────────────────────────────────────────────────────────
document.body.dataset.mode = state.mode;
renderRefSlots();
updateSteps();
</script>

<script>
(function () {
  var btn = document.getElementById('sidebarToggle');
  var sidebar = document.getElementById('sidebar');
  if (!btn || !sidebar) return;
  btn.addEventListener('click', function () {
    var collapsed = document.body.classList.toggle('sidebar-collapsed');
    btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    btn.title = collapsed ? 'Show panel' : 'Hide panel';
    btn.setAttribute('aria-label', collapsed ? 'Show panel' : 'Hide panel');
    if (typeof hasImageLoaded === 'function' && hasImageLoaded() && viewIsFitted) {
      fitToWindow();
      if (typeof renderAll === 'function') renderAll();
    }
  });
})();
</script>
</body>
